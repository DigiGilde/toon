# Findings we know about and deliberately leave in place, with a date on
# which they come back automatically. Trivy reads this file itself;
# pip-audit and npm audit are hooked into it via
# scripts/vulnerabilities.py, so there is one place where an
# accepted finding is written down.
vulnerabilities:
  - id: CVE-2026-76844
    expired_at: 2026-11-24
    statement: >-
      zlib1g in the python:3.15-slim-trixie runtime base. The newest upstream
      image still carries 1:1.3.dfsg+really1.3.1-1+b1;
      containers/toon/Containerfile upgrades zlib1g to deb13u1, so the built
      image that deploy.yml scans is clean. The CI scan looks at the base
      image, so this entry keeps it from failing. Once the FROM pin moves to
      an image with deb13u1, both this entry and the upgrade go.
  - id: CVE-2026-85091
    expired_at: 2026-11-24
    statement: >-
      zlib1g in the python:3.15-slim-trixie runtime base, the same package
      and the same fix as CVE-2026-76844 above. Also zlib 1.3.2-r0 in the
      nginx-unprivileged:1.31-alpine-slim base of the dev nginx;
      containers/nginx-dev/Containerfile upgrades it past 1.3.2-r1.
  - id: CVE-2026-107891
    expired_at: 2026-11-24
    statement: >-
      musl 1.2.6-r2 in the nginx-unprivileged:1.31-alpine-slim base of the
      dev nginx, which only runs in dev/compose.yml. No newer upstream image
      exists yet; containers/nginx-dev/Containerfile upgrades musl to
      1.2.6-r3. Once the FROM pin moves past it, both this entry and the
      upgrade go.
