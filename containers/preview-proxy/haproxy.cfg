global
    log stdout format raw local0
    maxconn 256
    nbthread 1

defaults
    log     global
    mode    http
    option  dontlognull
    log-format "%ci:%cp [%tr] %ft %b/%s %TR/%Tw/%Tc/%Tr/%Ta %ST %B %tsc %HM %HPO"
    timeout connect 5s
    timeout client  300s
    timeout server  300s
    timeout http-request 10s

frontend in
    bind *:8080
    default_backend app

backend app
    server app "${TOON_APP}"
