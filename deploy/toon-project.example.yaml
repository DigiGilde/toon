# Toon on ZAD: example project file.
#
# ZAD does not accept Kubernetes manifests. A project is this declarative
# YAML file; the Operations Manager generates Deployment, Service, Ingress,
# PVC, Secret and the Keycloak client from it. This file is an EXAMPLE: the
# real project file lives in the ZAD projects repository and is edited via
# the portal, `zadctl` or the API. See docs/deploying-on-zad.md for the
# step plan, the secrets and the open questions for the platform team.
#
# Validated against schema 2.17 of RijksICTGilde/RIG-Cluster at 2d27357
# (11 November 2026): operations-manager/python/opi/schemas/project_v2.json,
# plus the publish-on-web config models for what sits inside its `config`.
# The platform checks a file against the schema of the `schema-version` it
# names.
#
# WHAT THE PLATFORM TEAM MUST APPROVE (without these two the deployment falls
# back to the cluster address and neither public hostname appears at all, see
# `domains` in the project's `publish-on-web` config below):
#   1. the domain rijks.app for this project;
#   2. the subdomain `toon` on that domain.
#
# WHAT DIFFERS PER ENVIRONMENT:
#   - `subdomain` and `base-domain`, and thereby TOON_BASE_URL,
#     TOON_CONTENT_BASE_URL and the second OIDC redirect URI;
#   - the image (CI sets that per deploy, this file does not need it);
#   - the secrets (user-env-vars, set per deployment with `zadctl env`).

# `name` and the deployment's `namespace` stay `plak`: they are ZAD's own
# names for the existing project, not the product name.
name: plak
display-name: "Toon"
description: "Statische sites publiceren en delen, met previews per pull request"

# The Operations Manager's latest schema version (LATEST_SCHEMA_VERSION in
# opi/services/schema_migration.py). Quoted, because unquoted 2.10 would read
# as 2.1. A file that names an older version is checked against that
# version's schema and migrated on write.
schema-version: "2.17"

clusters:
  - odcn-production

# At least one member needs the role admin, or nobody can manage the members
# and tokens any more.
users:
  - email: fill-in@minbzk.nl
    roles: [admin, ops]

# A service entry is a bare string or a record with `name` and `config`, the
# form the platform writes back (project_v2.json's `service-entry`). What may
# sit in `config` is checked per service.
services:
  - name: publish-on-web
    config:
      # Domain and subdomain approval (opi/connectors/subdomain.py). Requesting
      # it yourself gives status `requested`, and a platform admin sets it to
      # `approved`. As long as that has not happened the deployment falls back
      # to the format component-deployment-project on the cluster address and
      # no host below matches what TOON_BASE_URL/TOON_CONTENT_BASE_URL say. The
      # platform manages this block itself: a write via the portal or the API
      # keeps it, even when the caller leaves it out.
      domains:
        allowed-domains:
          - domain: rijks.app
            status: requested
            supports-dots: true
            issuer: letsencrypt
            restricted-subdomains: true
        allowed-subdomains:
          - domain: rijks.app
            subdomains:
              - name: toon
                status: requested
  - postgresql-database
  - persistent-storage
  - name: keycloak
    config:
      # sso-only: the project realm brokers to the rig-platform realm and
      # that to SSO Rijk (SAML). Toon has no local accounts.
      template: sso-only
      # The deployment client automatically gets https://{host}/* for every
      # ingress host of the deployment, but the root web address is not
      # included: once `domain-format` is set explicitly the platform does
      # not add the root host to that list. The callback on the content
      # origin thus needs to be added here by hand, per environment.
      additional_redirect_uris:
        - "https://toon.rijks.app/-/oauth2/callback"

components:
  # The component name is the first label of the hostname
  # ({component}.{subdomain}.{domain}), so this one component is called
  # `beheer` and not `app`: it serves beheer.toon.rijks.app. It is also
  # the component that serves toon.rijks.app via `root-component` in the
  # deployment's `publish-on-web` config. One component is enough because the
  # app itself does content, SPA and host separation (ADR: no nginx sidecar;
  # ZAD knows exactly one container per component).
  - name: beheer
    type: deployment
    ports:
      inbound: [8080]
      outbound: [443, 5432]
    # No health-check service: without that service the platform checks the
    # component at TCP level on its first inbound port, and that is exactly
    # what we want. An HTTP probe would not work: /-/healthz exists on the
    # admin host only and the probe arrives with the pod IP as Host, which
    # the app rejects.
    services:
      - publish-on-web
      - keycloak
      - postgresql-database
      - name: persistent-storage
        config:
          # 10Gi was granted to Toon; the portal and the API offer at most
          # 1Gi, so do not change this service there (docs/deploying-on-zad.md
          # §9). How full it gets shows in /-/healthz, in the log and
          # in the platform admin view (docs/deploying-on-zad.md §5).
          - name: content
            size: 10Gi
            mount-path: /content
    resources:
      # The platform only reads the nested requests/limits shape; a loose
      # `cpu:`/`memory:` next to it is ignored and silently gives the
      # defaults. Limits of odcn-production: request <= 1024Mi / 250m,
      # limit <= 4096Mi.
      requests:
        memory: "256Mi"
        cpu: "100m"
      limits:
        memory: "1Gi"
        cpu: "500m"
    aliases:
      # postgresql-database is now one shared user (the read/write vs.
      # read-only role split was removed from the project); it provides
      # DATABASE_SERVER_HOST/-PORT/-USER, DATABASE_PASSWORD and DATABASE_DB.
      # Toon wants one DSN. Note: the password is filled in literally, not
      # percent-encoded.
      TOON_DB_URL: "postgresql+asyncpg://${DATABASE_SERVER_USER}:${DATABASE_PASSWORD}@${DATABASE_SERVER_HOST}:${DATABASE_SERVER_PORT}/${DATABASE_DB}"

deployments:
  - name: productie
    cluster: odcn-production
    namespace: plak
    # The web address sits in the deployment's own `publish-on-web` config,
    # as a record with `reference`: the single-key form is refused here.
    # Since schema 2.7 the deployment itself has none of these fields.
    #
    # `domain-format: component.subdomain` gives {component}.{subdomain}.
    # {domain}, i.e. beheer.toon.rijks.app. There is no `domain-mode` any
    # more: the platform's v2.8 migration turned `nice-url` into this
    # `domain-format` and dropped the key.
    services:
      - reference: publish-on-web
        config:
          domain-format: component.subdomain
          subdomain: toon
          base-domain: rijks.app
          issuer: letsencrypt
          # Lets the same component also serve the address without the
          # first label: beheer.toon.rijks.app (beheer) and toon.rijks.app
          # (content).
          root-component: beheer
    backup:
      # The scheduling happens here; `backup.enabled` at the bottom only
      # sets the label that makes the PVC eligible for backup. Without this
      # block the platform creates nothing automatically and after a
      # deleted site there is only something to restore if someone started
      # a run manually. RRULE (RFC 5545 subset), times in Europe/Amsterdam.
      # A clone deliberately does not inherit this block, so it only
      # affects the deployment it is set on.
      schedule: "FREQ=DAILY;BYHOUR=2;BYMINUTE=0"
      resource_types:
        - pvc
        - database
    components:
      - reference: beheer
        # CI overwrites this on every deploy (upsert-deployment).
        image: "ghcr.io/digigilde/toon:latest"
        env-vars:
          TOON_ENVIRONMENT: "productie"
          TOON_CONTENT_ROOT: "/content"
          # Must match the two hosts above exactly: the app derives host
          # separation, the HSTS decision and every shareable URL from
          # them. TOON_BASE_URL (the beheer component's own ingress host)
          # could be filled by the platform via a `${PUBLIC_HOST}` user-env-
          # var instead (docs/PUBLIC_HOST_SUBSTITUTION.md in the ZAD
          # platform's own repository, not this one), but
          # TOON_CONTENT_BASE_URL cannot: PUBLIC_HOST always resolves to the
          # component's own primary ingress hostname, never to the separate
          # root ingress that `root-component` adds, so the content origin
          # stays hand-typed per environment either way. Both are kept
          # literal here for symmetry.
          TOON_BASE_URL: "https://beheer.toon.rijks.app"
          TOON_CONTENT_BASE_URL: "https://toon.rijks.app"
          TOON_OIDC_ISS_REQUIRED: "true"
          # The ZAD Keycloak provides a client-secret client;
          # private_key_jwt cannot be set up via self-service.
          # TOON_OIDC_ISSUER, TOON_OIDC_CLIENT_ID and
          # TOON_OIDC_CLIENT_SECRET come from the service's OIDC_*
          # variables.
          TOON_OIDC_CLIENT_AUTH: "client_secret_post"
          # Empty: the ZAD Keycloak only advertises acr "0" and "1", so any
          # eIDAS LoA requirement would lock everyone out. The app logs at
          # startup that there is no acr check.
          TOON_OIDC_REQUIRED_ACR: ""
          # The HAProxy router stands in front of the pod and adds an
          # X-Forwarded-For line of its own behind the client's, so Toon reads
          # the last entry. Position rather than recognition, because the
          # router pods sit on the cluster pod network and that range is not
          # on offer.
          TOON_BEHIND_PROXY: "true"
          # The `sub` from the ZAD Keycloak of the first platform admin;
          # they thereby get in without a member record. Different per
          # environment.
          TOON_BOOTSTRAP_ADMIN_SUB: "fill-in"
          # Who runs this installation and how to reach them, shown on the
          # public privacy and accessibility pages. The address is also the
          # mail Contact in security.txt.
          TOON_OPERATOR_NAME: "Digi Gilde"
          TOON_OPERATOR_EMAIL: "digigilde@rijksoverheid.nl"
          # A Rijksoverheid installation: security.txt lists NCSC-NL's CVD routes.
          TOON_SECURITY_TXT_NCSC: "true"
        # The secrets are NOT here. Set them per deployment with
        # `zadctl env` (AGE-encrypted in this file as user-env-vars):
        #   TOON_SESSION_SECRET   at least 32 bytes
        #   TOON_AUDIT_PEPPER    at least 32 bytes, rotate as in docs/audit-log.md
        #   TOON_AUDIT_IP_KEY    base64 of 32 random bytes, see docs/deploying-on-zad.md
        # After a rotation, also the comma-separated lists of earlier values,
        # newest first: TOON_AUDIT_PEPPER_PREVIOUS and TOON_AUDIT_IP_KEY_PREVIOUS.
        #
        # Do NOT set these component-wide: a second deployment would
        # inherit productie's. See docs/deploying-on-zad.md, "A second
        # deployment".

# Only the PVC label that makes the content volume eligible for backup.
# The scheduling itself is under `deployments[].backup.schedule`.
backup:
  enabled: true
